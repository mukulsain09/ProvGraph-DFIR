    var cy = cytoscape({
      container: document.getElementById('cy'),
      elements: elements,
      style: [
        {
          selector: 'node',
          style: {
            'background-color': 'data(color)',
            'label': 'data(label)',
            'color': '#f0f6fc',
            'font-size': '11px',
            'text-valign': 'center',
            'text-halign': 'center',
            'text-wrap': 'wrap',
            'width': 65,
            'height': 65,
            'border-width': 2,
            'border-color': '#30363d',
            'text-outline-color': '#0d1117',
            'text-outline-width': 2

        },
        {
          selector: '.poi',
          style: {
            'shape': 'diamond',
            'width': 85,
            'height': 85,
            'border-width': 4,
            'border-color': '#d81b60',
            'font-weight': 'bold',
            'font-size': '13px'
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 'data(width)',
            'line-color': 'data(color)',
            'target-arrow-color': 'data(color)',
            'target-arrow-shape': 'triangle',
            'curve-style': 'bezier',
            'label': 'data(label)',
            'font-size': '10px',
            'color': '#8b949e',
            'text-rotation': 'autorotate',
            'text-background-color': '#0d1117',

        {
          selector: '.macro_edge',
          style: {
            'line-style': 'dashed',
            'line-dash-pattern': [6, 3],
            'font-weight': 'bold',
            'color': '#d2a8ff'
          }
        },
        {
          selector: ':selected',
          style: {
            'border-color': '#58a6ff',
            'border-width': 4,
            'line-color': '#58a6ff',
            'target-arrow-color': '#58a6ff'
          }
        }
      ],
      layout: {
        name: 'dagre',
        rankDir: 'LR',
        nodeSep: 60,
        rankSep: 80,
        animate: true,
        animationDuration: 500
      }
    });

    function runLayout(layoutName) {
      cy.layout({
        name: layoutName,
        rankDir: 'LR',
        animate: true,
        animationDuration: 500
      }).run();
    }

    function centerPoI() {
      if (poiId) {
        var node = cy.getElementById(poiId);
        if (node.length > 0) {
          cy.animate({
            center: { eles: node },
            zoom: 1.5,
            duration: 600
          });
          node.select();
          showNodeDetails(node.data());
        }
      }
    }

    function hidePanel() {
      document.getElementById('details-panel').style.display = 'none';
    }

    function showNodeDetails(data) {
      var panel = document.getElementById('details-panel');
      var title = document.getElementById('panel-title');
      var content = document.getElementById('panel-content');

      title.innerText = (data.is_poi ? "⭐ [Point of Interest] " : "") + data.event_type;
      var rows = [
        ["Record ID", data.record_id],
        ["UTC Timestamp", data.timestamp_utc],
        ["Host", data.host_name],
        ["Process GUID", data.process_guid || "N/A"],
        ["Target / Object", data.target_object || "N/A"],
        ["Hashes", data.hashes || "N/A"]
      ];

      var html = "";
      rows.forEach(function(r) {
        html += '<div class="prop-row">' +
          '<div class="prop-label">' + r[0] + ':</div>' +
          '<div class="prop-val">' + (r[1] || "-") + '</div></div>';
      });
      content.innerHTML = html;
      panel.style.display = 'block';
    }

    function showEdgeDetails(data) {
      var panel = document.getElementById('details-panel');
      var title = document.getElementById('panel-title');
      var content = document.getElementById('panel-content');

      title.innerText = data.is_macro ? "🗂️ Contracted Macro-Edge" : "➡️ Causal Edge";
      var rows = [
        ["Relation", data.relation_type],
        ["Is Macro?", data.is_macro ? "Yes (" + data.event_count + " events)" : "No"],
        ["Macro ID", data.macro_edge_id || "None"],
        ["Source Key", data.source],
        ["Target Key", data.target]
      ];

      if (data.is_macro && data.ordered_event_keys) {
        rows.push(["Collapsed Events", data.ordered_event_keys.length + " sequential records"]);
      }

      var html = "";
      rows.forEach(function(r) {
        html += '<div class="prop-row">' +
          '<div class="prop-label">' + r[0] + ':</div>' +
          '<div class="prop-val">' + (r[1] || "-") + '</div></div>';
      });
      content.innerHTML = html;
      panel.style.display = 'block';
    }

    cy.on('tap', 'node', function(evt) {
      showNodeDetails(evt.target.data());
    });

    cy.on('tap', 'edge', function(evt) {
      showEdgeDetails(evt.target.data());
    });

    cy.on('tap', function(evt) {
      if (evt.target === cy) {
        hidePanel();
      }
    });

    // Center on PoI on initial load
    setTimeout(function() {
      centerPoI();
    }, 400);
