# ProvGraph-DFIR Benchmark Scenarios Catalog
# Reference datasets, PoI filters, and Ground-Truth ATT&CK Techniques

scenarios:
  - id: "empire_vbs"
    name: "Empire VBS Launcher"
    file: "empire_launcher_vbs_2020-09-04160940.json"
    technique: "T1059.005"
    description: "Empire PowerShell agent delivered via malicious VBS stager script"
    poi_selector:
      event_id: 1
      target_substring: "whoami"
    ground_truth_steps:
      - step_id: "S1"
        technique_id: "T1059.005"
        technique_name: "Visual Basic"
        tactic: "Execution"
        description: "VBS launcher script executed by wscript.exe"
        expected_event_id: 1
        expected_target_substring: "wscript.exe"
      - step_id: "S2"
        technique_id: "T1059.001"
        technique_name: "PowerShell"
        tactic: "Execution"
        description: "PowerShell spawned with base64 encoded stager"
        expected_event_id: 1
        expected_target_substring: "powershell.exe"
      - step_id: "S3"
        technique_id: "T1082"
        technique_name: "System Information Discovery"
        tactic: "Discovery"
        description: "Reconnaissance command whoami.exe executed"
        expected_event_id: 1
        expected_target_substring: "whoami.exe"

  - id: "bitsadmin"
    name: "BITSAdmin Download Cradle"
    file: "cmd_bitsadmin_download_psh_script_2020-10-2302365189.json"
    technique: "T1197"
    description: "Living-off-the-land file download staged via Windows BITSAdmin utility"
    poi_selector:
      event_id: 1
      target_substring: "bitsadmin"
    ground_truth_steps:
      - step_id: "S1"
        technique_id: "T1197"
        technique_name: "BITS Jobs"
        tactic: "Defense Evasion"
        description: "BITSAdmin executed to stage download job"
        expected_event_id: 1
        expected_target_substring: "bitsadmin.exe"
      - step_id: "S2"
        technique_id: "T1105"
        technique_name: "Ingress Tool Transfer"
        tactic: "Command and Control"
        description: "Remote payload or staging buffer written to disk by BITS transfer"
        expected_event_id: 11
        expected_target_substring: "bit"

  - id: "empire_mimikatz"
    name: "Empire Mimikatz LSASS Dump"
    file: "empire_mimikatz_logonpasswords_2020-08-07103224.json"
    technique: "T1003.001"
    description: "In-memory LSASS handle acquisition and credential dumping via Mimikatz"
    poi_selector:
      event_id: 10
      target_substring: "lsass"
    ground_truth_steps:
      - step_id: "S1"
        technique_id: "T1059.001"
        technique_name: "PowerShell"
        tactic: "Execution"
        description: "Interactive PowerShell Empire stager session"
        expected_target_substring: "powershell"
      - step_id: "S2"
        technique_id: "T1003.001"
        technique_name: "LSASS Memory"
        tactic: "Credential Access"
        description: "ProcessAccess memory handle acquisition targeting lsass.exe"
        expected_event_id: 10
        expected_target_substring: "lsass"
      - step_id: "S3"
        technique_id: "T1033"
        technique_name: "System Owner/User Discovery"
        tactic: "Discovery"
        description: "whoami execution spawned by stager"
        expected_event_id: 1
        expected_target_substring: "whoami.exe"

  - id: "metasploit"
    name: "Metasploit Lateral & Credential Dumping"
    file: "metasploit_logonpasswords_lsass_memory_dump.json"
    technique: "T1003.001 / T1059.003"
    description: "Multi-stage Metasploit lateral execution, credential extraction, and log clearing"
    poi_selector:
      event_id: 1
      target_substring: "wevtutil"
    ground_truth_steps:
      - step_id: "S1"
        technique_id: "T1059.003"
        technique_name: "Windows Command Shell"
        tactic: "Execution"
        description: "Initial command shell execution"
        expected_target_substring: "cmd.exe"
      - step_id: "S2"
        technique_id: "T1003.001"
        technique_name: "LSASS Memory"
        tactic: "Credential Access"
        description: "Payload scraping credentials from lsass.exe"
        expected_event_id: 10
        expected_target_substring: "lsass"
      - step_id: "S3"
        technique_id: "T1070.001"
        technique_name: "Clear Windows Event Logs"
        tactic: "Defense Evasion"
        description: "Log clearing utility wevtutil.exe executed"
        expected_event_id: 1
        expected_target_substring: "wevtutil"

