[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provgraph"
version = "0.1.0"
description = "Deterministic Causal Slicing and Lossless Hierarchical Contraction for Windows Forensic Provenance Graphs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NFSU DFIR Research Team" }
]
dependencies = [
    "click>=8.0",
    "networkx>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
provgraph = "provgraph.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
viz = [
    "streamlit>=1.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true
